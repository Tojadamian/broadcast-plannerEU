[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcast-planner"
version = "0.1.0"
description = "EU broadcast network planner for master-class teaching (DVB-T/T2 and 5G broadcast)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Broadcast Planner Course" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pyyaml>=6.0",
    "streamlit>=1.32",
    "folium>=0.16",
    "streamlit-folium>=0.18",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "numba>=0.59",
]

[project.optional-dependencies]
itu = ["Py1546 @ git+https://github.com/eeveetza/Py1546.git"]
dev = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
broadcast-planner = "app.streamlit_app:main"
prepare-examples = "broadcast_planner.data.prepare_examples:main"
download-data = "broadcast_planner.data.download:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["broadcast_planner*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
